<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none">
  <!-- Icon: Building silhouette with M -->
  <g transform="translate(0, 4)">
    <!-- Building outline -->
    <rect x="4" y="12" width="32" height="28" rx="2" fill="#0A1628" stroke="#D4AF37" stroke-width="1.5"/>
    <!-- Windows -->
    <rect x="8" y="18" width="6" height="6" rx="1" fill="#D4AF37" opacity="0.6"/>
    <rect x="17" y="18" width="6" height="6" rx="1" fill="#D4AF37" opacity="0.6"/>
    <rect x="26" y="18" width="6" height="6" rx="1" fill="#D4AF37" opacity="0.6"/>
    <rect x="8" y="28" width="6" height="6" rx="1" fill="#D4AF37" opacity="0.6"/>
    <rect x="17" y="28" width="6" height="6" rx="1" fill="#D4AF37" opacity="0.6"/>
    <rect x="26" y="28" width="6" height="6" rx="1" fill="#D4AF37" opacity="0.6"/>
    <!-- Roof -->
    <path d="M2 12 L20 2 L38 12" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Logo Text -->
  <text 
    x="130" 
    y="28" 
    dominant-baseline="middle" 
    text-anchor="middle"
    font-family="Outfit, sans-serif"
    font-size="20"
    font-weight="600"
    letter-spacing="0.12em"
    fill="#0A1628"
  >
    THE MUDEER
  </text>
  
  <!-- Decorative Line -->
  <line 
    x1="55" 
    y1="38" 
    x2="205" 
    y2="38" 
    stroke="#D4AF37" 
    stroke-width="1.5"
    stroke-linecap="round"
  />
</svg>